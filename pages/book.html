<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Trip - ExploreWorld</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="form-container">
    <h2>Book Your Trip</h2>
    <form id="bookingForm" action="#" method="post">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email address" required>

      <label for="address">Full Address</label>
      <textarea id="address" name="address" placeholder="Enter your full address" required></textarea>

      <label for="package">Select Package</label>
      <select id="package" name="package" required>
        <option value="">-- Select a Package --</option>
        <option value="Goa Beach Escape">Goa Beach Escape</option>
        <option value="Jaipur Heritage Tour">Jaipur Heritage Tour</option>
        <option value="Kerala Backwater Cruise">Kerala Backwater Cruise</option>
        <option value="Rishikesh Adventure Trip">Rishikesh Adventure Trip</option>
        <option value="4 Dham Dharmic Yatra">4 Dham Dharmic Yatra</option>
        <option value="Manali Himalayan Tour">Manali Himalayan Tour</option>
        <option value="Maldives Getaway">Maldives Getaway</option>
        <option value="Bali Tropical Paradise">Bali Tropical Paradise</option>
        <option value="Switzerland Alpine Tour">Switzerland Alpine Tour</option>
        <option value="Thailand Beach & Culture">Thailand Beach & Culture</option>
        <option value="Dubai Luxury Experience">Dubai Luxury Experience</option>
        <option value="Singapore City Tour">Singapore City Tour</option>
      </select>

      <label for="date">Travel Date</label>
      <div class="datepicker-container">
        <input type="text" id="date" name="date" placeholder="Select Travel Date" readonly required>
        <div class="calendar-picker" id="calendarPicker">
          <div class="calendar-header">
            <h4 id="monthYear">February 2026</h4>
            <div class="nav-btns">
              <button type="button" id="prevBtn">&lt;</button>
              <button type="button" id="nextBtn">&gt;</button>
            </div>
          </div>
          <div class="calendar-body" id="calendarBody">
            <div id="daysView">
              <div class="calendar-weekdays">
                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
              </div>
              <div class="calendar-days" id="calendarDays"></div>
            </div>
            <div id="monthsView" class="calendar-months" style="display: none;"></div>
            <div id="yearsView" class="calendar-years" style="display: none;"></div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn" style="margin-top: 20px;">Submit Booking</button>
    </form>

    <a href="packages.html" class="back-link">← Back to Packages</a>
  </div>

  <div class="success-overlay" id="successOverlay">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h2>Booking Successful!</h2>
      <p>Your details will be listed in our database we will contact you as soon as possible.</p>
      <a href="packages.html" class="btn">Explore More Packages</a>
    </div>
  </div>

  <script>
    const dateInput = document.getElementById('date');
    const calendarPicker = document.getElementById('calendarPicker');
    const monthYear = document.getElementById('monthYear');
    const calendarBody = document.getElementById('calendarBody');
    const calendarDays = document.getElementById('calendarDays');
    const monthsView = document.getElementById('monthsView');
    const yearsView = document.getElementById('yearsView');
    const daysView = document.getElementById('daysView');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const bookingForm = document.getElementById('bookingForm');
    const successOverlay = document.getElementById('successOverlay');

    let currentDate = new Date();
    let selectedDate = null;
    let currentView = 'DAYS';

    function renderCalendar() {
      if (currentView === 'DAYS') showDays();
      else if (currentView === 'MONTHS') showMonths();
      else if (currentView === 'YEARS') showYears();
    }

    function showDays() {
      currentView = 'DAYS';
      daysView.style.display = 'block';
      monthsView.style.display = 'none';
      yearsView.style.display = 'none';
      document.querySelector('.calendar-weekdays').style.display = 'grid';
      
      calendarDays.innerHTML = '';
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      monthYear.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentDate);

      for (let i = firstDay; i > 0; i--) {
        const span = document.createElement('span');
        span.classList.add('prev-date');
        span.innerText = prevLastDate - i + 1;
        calendarDays.appendChild(span);
      }

      const today = new Date();
      for (let i = 1; i <= lastDate; i++) {
        const span = document.createElement('span');
        if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          span.classList.add('today');
        }
        if (selectedDate && i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear()) {
          span.classList.add('selected');
        }
        span.innerText = i;
        span.addEventListener('click', () => {
          selectedDate = new Date(year, month, i);
          dateInput.value = selectedDate.toLocaleDateString('en-GB');
          calendarPicker.classList.remove('active');
          renderCalendar();
        });
        calendarDays.appendChild(span);
      }

      const remainingSlots = 42 - (firstDay + lastDate);
      for (let i = 1; i <= remainingSlots; i++) {
        const span = document.createElement('span');
        span.classList.add('next-date');
        span.innerText = i;
        calendarDays.appendChild(span);
      }
    }

    function showMonths() {
      currentView = 'MONTHS';
      daysView.style.display = 'none';
      monthsView.style.display = 'grid';
      yearsView.style.display = 'none';
      document.querySelector('.calendar-weekdays').style.display = 'none';
      
      monthYear.innerText = currentDate.getFullYear();
      monthsView.innerHTML = '';
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      months.forEach((month, index) => {
        const span = document.createElement('span');
        span.innerText = month;
        if (index === currentDate.getMonth()) span.classList.add('selected');
        span.addEventListener('click', () => {
          currentDate.setMonth(index);
          showDays();
        });
        monthsView.appendChild(span);
      });
    }

    function showYears() {
      currentView = 'YEARS';
      daysView.style.display = 'none';
      monthsView.style.display = 'none';
      yearsView.style.display = 'grid';
      document.querySelector('.calendar-weekdays').style.display = 'none';
      
      const startYear = Math.floor(currentDate.getFullYear() / 12) * 12;
      monthYear.innerText = `${startYear} - ${startYear + 11}`;
      yearsView.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const year = startYear + i;
        const span = document.createElement('span');
        span.innerText = year;
        if (year === currentDate.getFullYear()) span.classList.add('selected');
        span.addEventListener('click', () => {
          currentDate.setFullYear(year);
          showMonths();
        });
        yearsView.appendChild(span);
      }
    }

    monthYear.addEventListener('click', () => {
      if (currentView === 'DAYS' || currentView === 'MONTHS') showYears();
    });

    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentView === 'DAYS') currentDate.setMonth(currentDate.getMonth() - 1);
      else if (currentView === 'YEARS') currentDate.setFullYear(currentDate.getFullYear() - 12);
      renderCalendar();
    });

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentView === 'DAYS') currentDate.setMonth(currentDate.getMonth() + 1);
      else if (currentView === 'YEARS') currentDate.setFullYear(currentDate.getFullYear() + 12);
      renderCalendar();
    });

    dateInput.addEventListener('click', (e) => {
      e.stopPropagation();
      calendarPicker.classList.add('active');
      renderCalendar();
    });

    document.addEventListener('click', (e) => {
      if (!calendarPicker.contains(e.target) && e.target !== dateInput) {
        calendarPicker.classList.remove('active');
        currentView = 'DAYS';
      }
    });

    bookingForm.addEventListener('submit', (e) => {
      e.preventDefault();
      successOverlay.classList.add('active');
      bookingForm.reset();
      selectedDate = null;
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
