<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .container {
            padding: 20px;
            width: 100%;
        }

        .card {
            max-width: 460px;
            margin: auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
            animation: fadeIn 1.2s ease;
        }

        .card h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .loader {
            width: 55px;
            height: 55px;
            margin: 25px auto;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .small-text {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 10px;
        }

        button {
            margin-top: 25px;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: #ffffff;
            color: #203a43;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>🚧 Website Under Maintenance</h1>
            <p>
                Our website is currently undergoing scheduled maintenance.<br>
                We’ll be back very soon with an improved experience.
            </p>

            <div class="loader"></div>

            <p class="small-text">
                Thank you for your patience ❤️
            </p>

            <button onclick="notifyUser()">Notify Me</button>
        </div>
    </div>

    <script>
        function notifyUser() {
            alert("Thanks for your interest! We'll notify you once we're live 🚀");
        }
    </script>

</body>
</html>
